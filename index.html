<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Dear Mawa</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,sans-serif}
#stars{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#18324d 0,#0a1627 45%,#030814 100%)}
.center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:5}
button{border:2px solid #65eaff;border-radius:30px;background:#102238;color:#dffcff;padding:16px 40px;font-size:24px;font-weight:800;letter-spacing:1px;box-shadow:0 0 18px #31dff5, inset 0 0 12px #1aa9c2;cursor:pointer}
#count{font-size:100px;font-weight:900;text-shadow:0 0 30px #5cecff;display:none}
#scene{display:none;position:fixed;inset:0;z-index:3}
.message{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;opacity:0;font-weight:800;text-align:center;text-shadow:0 0 12px #39eaff,0 0 25px #167bff}
.line{font-size:clamp(22px,6vw,44px)}
.small{font-size:clamp(17px,4.5vw,29px)}
@keyframes rise{0%{transform:translate(-50%,110vh);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-20vh);opacity:0}}
.firework{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:boom 1.8s ease-out forwards}
@keyframes boom{to{transform:scale(1);opacity:0}}
#wish{display:none;position:fixed;bottom:35px;left:50%;transform:translateX(-50%);z-index:10;font-size:17px;padding:12px 25px}
</style>
</head>
<body>
<div id="stars"></div>
<div class="center"><button id="start">START</button><div id="count"></div></div>
<div id="scene"></div>
<button id="wish">MAKE A WISH ✨</button>
<script>
const start=document.getElementById('start'), count=document.getElementById('count'), scene=document.getElementById('scene'), wish=document.getElementById('wish');
const lines=[
['Happy Birthday 🎂💖','line'],
['Dear Mawa 🌸','line'],
['May your life be filled with happiness ✨','small'],
['Keep smiling and shining every day 🫶','small'],
['Wishing you endless joy and beautiful memories 🎉','small'],
['You are truly special 💗','line'],
['Have the most amazing birthday ever! 🥳🎂','small']
];
function fire(x,y){
 for(let i=0;i<45;i++){let p=document.createElement('i');p.className='firework';p.style.left=x+'px';p.style.top=y+'px';
 let a=Math.random()*Math.PI*2,d=40+Math.random()*120;
 p.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;p.style.background=`hsl(${Math.random()*360},100%,70%)`;
 scene.appendChild(p);setTimeout(()=>p.remove(),1900)}
}
start.onclick=async()=>{
 start.style.display='none';count.style.display='block';
 for(let n=1;n<=3;n++){count.textContent=n;await new Promise(r=>setTimeout(r,850))}
 count.style.display='none';scene.style.display='block';
 fire(innerWidth*.5,innerHeight*.38);setTimeout(()=>fire(innerWidth*.25,innerHeight*.3),400);setTimeout(()=>fire(innerWidth*.75,innerHeight*.28),800);
 lines.forEach((v,i)=>{let e=document.createElement('div');e.className='message '+v[1];e.textContent=v[0];e.style.top=(82-i*8)+'%';e.style.animation=`rise ${8.5+i*.15}s linear ${i*.75}s forwards`;scene.appendChild(e)});
 setTimeout(()=>wish.style.display='block',6500);
}
wish.onclick=()=>{fire(innerWidth*.5,innerHeight*.45);wish.textContent='YOUR WISH WILL COME TRUE 💖✨'}
</script>
</body></html>
